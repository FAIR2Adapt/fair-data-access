<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 624" width="1340" height="624"
     font-family="DejaVu Sans, Verdana, Helvetica, sans-serif">
  <!-- Figure 1 of the ORE method article. Type is sized so that, printed 6.5 in wide,
       body text lands near 8 pt: pt = font_units * 6.5 / 1340 * 72. Box widths are set
       from the longest string each must hold, so nothing overflows. -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3f4a56"/>
    </marker>
    <style>
      .grp  { fill:none; stroke-width:2.2; stroke-dasharray:8 6; }
      .glab { font-size:26px; font-weight:700; }
      .box  { stroke:#3f4a56; stroke-width:1.8; rx:10; }
      .t    { font-size:28px; font-weight:700; fill:#16202b; text-anchor:middle; }
      .s    { font-size:22px; fill:#43505e; text-anchor:middle; }
      .edge { stroke:#3f4a56; stroke-width:2.4; fill:none; marker-end:url(#ah); }
      .elab { font-size:19px; font-style:italic; fill:#3f4a56; }
      /* drawn under .elab to knock out any line crossing a label
         (cairosvg ignores paint-order, so the halo needs its own pass) */
      .halo { font-size:19px; font-style:italic; fill:#ffffff;
              stroke:#ffffff; stroke-width:7; stroke-linejoin:round; }
    </style>
  </defs>
  <rect width="1340" height="624" fill="#ffffff"/>

  <!-- ===================== ROW 1 — the object ===================== -->
  <text class="glab" x="30"  y="42" fill="#8a7420">Metadata</text>
  <rect class="grp" x="30"  y="56" width="360" height="212" stroke="#8a7420"/>
  <rect class="box" x="48"  y="78" width="324" height="170" fill="#f4e6bd"/>
  <text class="t" x="210" y="140">RO-Crate</text>
  <text class="s" x="210" y="182">hasPolicy · distribution</text>
  <text class="s" x="210" y="214">variableMeasured</text>

  <text class="glab" x="420" y="42" fill="#1f5f8b">Trust layer — nanopubs</text>
  <rect class="grp" x="420" y="56" width="390" height="212" stroke="#1f5f8b"/>
  <rect class="box" x="438" y="78" width="354" height="80" fill="#d6e6f5"/>
  <text class="t" x="615" y="114">ODRL policy</text>
  <text class="s" x="615" y="146">permissions · prohibitions</text>
  <rect class="box" x="438" y="170" width="354" height="78" fill="#d6e6f5"/>
  <text class="t" x="615" y="205">Access grant</text>
  <text class="s" x="615" y="237">signed · auditable</text>

  <text class="glab" x="850" y="42" fill="#8d3a72">Identity + encryption</text>
  <rect class="grp" x="850" y="56" width="460" height="212" stroke="#8d3a72"/>
  <rect class="box" x="868" y="78" width="424" height="80" fill="#f3dcec"/>
  <text class="t" x="1080" y="114">DID (did:web)</text>
  <text class="s" x="1080" y="146">requester identity · public key</text>
  <rect class="box" x="868" y="170" width="424" height="78" fill="#f3dcec"/>
  <text class="t" x="1080" y="205">AES-256-GCM</text>
  <text class="s" x="1080" y="237">ECDH/HKDF key wrapping</text>

  <!-- ===================== ROW 2 — request time ===================== -->
  <text class="glab" x="30"  y="366" fill="#9e4426">Key server (GitHub)</text>
  <rect class="grp" x="30"  y="380" width="866" height="220" stroke="#9e4426"/>
  <rect class="box" x="48"  y="404" width="230" height="84" fill="#fadfd0"/>
  <text class="t" x="163" y="440">Issue</text>
  <text class="s" x="163" y="472">access request</text>
  <rect class="box" x="298" y="404" width="330" height="84" fill="#fadfd0"/>
  <text class="t" x="463" y="440">Actions</text>
  <text class="s" x="463" y="472">resolve · evaluate · wrap</text>
  <rect class="box" x="648" y="404" width="230" height="84" fill="#fadfd0"/>
  <text class="t" x="763" y="440">Pages</text>
  <text class="s" x="763" y="472">wrapped key</text>
  <rect class="box" x="48"  y="506" width="830" height="76" fill="#fadfd0"/>
  <text class="t" x="463" y="540">Secrets — dataset keys</text>
  <text class="s" x="463" y="570">never leave the workflow</text>

  <text class="glab" x="926" y="366" fill="#1f6b45">Data storage</text>
  <rect class="grp" x="926" y="380" width="384" height="220" stroke="#1f6b45"/>
  <rect class="box" x="944" y="404" width="166" height="84" fill="#d5ecdc"/>
  <text class="t" x="1027" y="440">Zenodo</text>
  <text class="s" x="1027" y="472">archival · DOI</text>
  <rect class="box" x="1126" y="404" width="166" height="84" fill="#d5ecdc"/>
  <text class="t" x="1209" y="440">S3 / EOSC</text>
  <text class="s" x="1209" y="472">cloud access</text>
  <rect class="box" x="944" y="506" width="348" height="76" fill="#d5ecdc"/>
  <text class="t" x="1118" y="540">Encrypted files</text>
  <text class="s" x="1118" y="570">safe to host publicly</text>

  <!-- ===================== EDGES ===================== -->
  <path class="edge" d="M372,118 H434"/>
  <text class="halo" x="378" y="108">hasPolicy</text>
  <text class="elab" x="378" y="108">hasPolicy</text>

  <path class="edge" d="M372,209 H434"/>
  <text class="halo" x="378" y="199">grant ref.</text>
  <text class="elab" x="378" y="199">grant ref.</text>

  <path class="edge" d="M278,446 H294"/>
  <text class="halo" x="222" y="396">trigger</text>
  <text class="elab" x="222" y="396">trigger</text>

  <path class="edge" d="M628,446 H644"/>

  <path class="edge" d="M400,488 V502"/>
  <text class="halo" x="408" y="500">reads</text>
  <text class="elab" x="408" y="500">reads</text>

  <!-- Actions -> trust layer, straight up through the band between the rows -->
  <path class="edge" d="M463,402 V252"/>
  <text class="halo" x="474" y="312">evaluates policy,</text>
  <text class="elab" x="474" y="312">evaluates policy,</text>
  <text class="halo" x="474" y="338">records grant</text>
  <text class="elab" x="474" y="338">records grant</text>

  <!-- Actions -> identity, routed orthogonally through the same band -->
  <path class="edge" d="M560,402 V320 H1080 V252"/>
  <text class="halo" x="760" y="312">resolves DID, wraps key</text>
  <text class="elab" x="760" y="312">resolves DID, wraps key</text>
</svg>
